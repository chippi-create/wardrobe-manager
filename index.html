<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ワードローブ</title>
  <meta name="description" content="手持ちの服とコーデを管理するアプリ">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ワードローブ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 id="viewTitle">クローゼット</h1>
    <span id="viewCount" class="count"></span>
  </header>

  <main>
    <!-- クローゼット -->
    <section id="view-closet" class="view" data-title="クローゼット">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="名前・メモで検索" autocomplete="off">
        <div id="categoryFilter" class="chip-row scroll"></div>
        <div class="filter-row">
          <select id="colorFilter" aria-label="色で絞り込み"></select>
          <select id="seasonFilter" aria-label="シーズンで絞り込み"></select>
          <select id="sortSelect" aria-label="並び順">
            <option value="new">新しい順</option>
            <option value="most">よく着る順</option>
            <option value="least">着ていない順</option>
          </select>
        </div>
      </div>
      <div id="itemGrid" class="grid"></div>
      <p id="itemEmpty" class="empty" hidden></p>
    </section>

    <!-- コーデ -->
    <section id="view-outfits" class="view" data-title="コーデ" hidden>
      <div id="outfitList" class="outfit-list"></div>
      <p id="outfitEmpty" class="empty" hidden></p>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view" data-title="設定" hidden>
      <div class="card">
        <h2>データについて</h2>
        <p>登録した服やコーデは、この端末のブラウザの中だけに保存されます。ほかの人に見られることはありません。</p>
        <p>機種変更やブラウザのデータ削除で消えてしまうので、ときどきバックアップを書き出しておくと安心です。</p>
        <p id="storageInfo" class="muted"></p>
      </div>
      <div class="card">
        <h2>バックアップ</h2>
        <p id="lastBackup" class="muted"></p>
        <div class="stack">
          <button id="exportBtn" class="btn primary">バックアップを書き出す</button>
          <label class="btn">
            バックアップを読み込む
            <input id="importInput" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
      <div class="card">
        <h2>すべて削除</h2>
        <p>この端末に保存されている服とコーデをすべて削除します。元に戻せません。</p>
        <button id="wipeBtn" class="btn danger">すべてのデータを削除</button>
      </div>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab" data-view="closet" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 0 6 0l5 2.5-1.5 4.5-2.5-1V20H8V10l-2.5 1L4 6.5z"/></svg>
      <span>クローゼット</span>
    </button>
    <button class="tab" data-view="outfits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      <span>コーデ</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <!-- 服の登録・編集 -->
  <dialog id="itemDialog" class="sheet">
    <form id="itemForm" method="dialog">
      <header class="sheet-header">
        <button type="button" class="btn ghost" data-close>閉じる</button>
        <h2 id="itemDialogTitle">服を登録</h2>
        <button type="submit" class="btn primary">保存</button>
      </header>
      <div class="sheet-body">
        <label class="photo-picker">
          <img id="itemPhotoPreview" alt="" hidden>
          <span id="itemPhotoPlaceholder" class="photo-placeholder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            写真を追加
          </span>
          <input id="itemPhotoInput" type="file" accept="image/*" hidden>
        </label>

        <label class="field">
          <span>名前</span>
          <input id="itemName" type="text" maxlength="60" placeholder="例：白のリネンシャツ">
        </label>

        <div class="field">
          <span>カテゴリ</span>
          <div id="itemCategory" class="chip-row wrap" role="radiogroup"></div>
        </div>

        <div class="field">
          <span>色（複数選べます）</span>
          <div id="itemColors" class="chip-row wrap"></div>
        </div>

        <div class="field">
          <span>シーズン（複数選べます）</span>
          <div id="itemSeasons" class="chip-row wrap"></div>
        </div>

        <label class="field">
          <span>メモ</span>
          <textarea id="itemMemo" rows="3" maxlength="500" placeholder="ブランド、サイズ、購入日など"></textarea>
        </label>

        <div id="itemWearSection" class="wear-box" hidden>
          <p id="itemWearInfo"></p>
          <button type="button" id="itemWearBtn" class="btn"></button>
        </div>

        <button type="button" id="itemDeleteBtn" class="btn danger subtle" hidden>この服を削除</button>
      </div>
    </form>
  </dialog>

  <!-- コーデの作成・編集 -->
  <dialog id="outfitDialog" class="sheet">
    <form id="outfitForm" method="dialog">
      <header class="sheet-header">
        <button type="button" class="btn ghost" data-close>閉じる</button>
        <h2 id="outfitDialogTitle">コーデを作成</h2>
        <button type="submit" class="btn primary">保存</button>
      </header>
      <div class="sheet-body">
        <label class="field">
          <span>名前</span>
          <input id="outfitName" type="text" maxlength="60" placeholder="例：週末のおでかけ">
        </label>

        <div class="field">
          <span>アイテムを選ぶ <em id="outfitSelectedCount" class="muted"></em></span>
          <div id="outfitPickerFilter" class="chip-row scroll"></div>
          <div id="outfitPicker" class="grid picker"></div>
          <p id="outfitPickerEmpty" class="empty small" hidden>まだ服が登録されていません。先にクローゼットに服を登録してください。</p>
        </div>

        <label class="field">
          <span>メモ</span>
          <textarea id="outfitMemo" rows="2" maxlength="500" placeholder="シーン、気分など"></textarea>
        </label>

        <div id="outfitWearSection" class="wear-box" hidden>
          <p id="outfitWearInfo"></p>
          <button type="button" id="outfitWearBtn" class="btn"></button>
        </div>

        <button type="button" id="outfitDeleteBtn" class="btn danger subtle" hidden>このコーデを削除</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
